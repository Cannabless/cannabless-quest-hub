name: Daily Holder Tracker

on:
  schedule:
    - cron: "0 7 * * *" # once per day
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node tracker.js
