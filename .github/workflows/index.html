<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CannaBless Rewards Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0f2d1f, #050b08);
  font-family: 'Inter', sans-serif;
  color: #eafff3;
}

header {
  padding: 40px;
  text-align: center;
}

header h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.5em;
  color: #7CFFB2;
}

table {
  width: 90%;
  margin: auto;
  border-collapse: collapse;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  padding: 14px;
  text-align: center;
}

th {
  background: rgba(124,255,178,0.15);
  color: #7CFFB2;
  text-transform: uppercase;
  font-size: 0.85em;
}

tr:nth-child(even) {
  background: rgba(255,255,255,0.03);
}

.tier-Seed { color: #aaa; }
.tier-Sprout { color: #7CFFB2; }
.tier-Rooted { color: #FFD36A; }
.tier-Evergreen { color: #5CFF87; font-weight: bold; }
</style>
</head>

<body>

<header>
  <h1>🌱 CannaBless Holder Rewards</h1>
  <p>Long-term conviction. Real rewards. No noise.</p>
</header>

<table id="table">
  <thead>
    <tr>
      <th>Wallet</th>
      <th>Tier</th>
      <th>Hold Days</th>
      <th>Boost</th>
      <th>Balance</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const SUPABASE_URL = "https://ofstciqggeuuzrmqhdhi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mc3RjaXFnZ2V1dXpybXFoZGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwMDA5ODQsImV4cCI6MjA4MzU3Njk4NH0.46YabyO64KLJmV83SIUV6k6aPxV4kBXAWJOfMKzQIME";

fetch(`${SUPABASE_URL}/rest/v1/rewards_dashboard`, {
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
  }
})
.then(res => res.json())
.then(data => {
  const tbody = document.querySelector("tbody");
  data.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.wallet_address.slice(0,4)}…${row.wallet_address.slice(-4)}</td>
      <td class="tier-${row.tier}">${row.tier}</td>
      <td>${row.hold_days}</td>
      <td>+${row.reward_weight}%</td>
      <td>${Number(row.current_balance).toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>

</body>
</html>
