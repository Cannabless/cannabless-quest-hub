<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CannaBless Quest Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #0b1f16, #020504);
  color: #eafff3;
  text-align: center;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}
button {
  background: linear-gradient(90deg,#3cff9a,#00ffcc);
  border: none;
  border-radius: 16px;
  padding: 14px 22px;
  font-weight: 900;
  cursor: pointer;
  margin: 8px;
  color: #003d22;
}
canvas {
  background: #081f14;
  border-radius: 16px;
  display: block;
  margin: 20px auto;
}
.wallet {
  word-break: break-all;
  font-weight: 800;
  color: #9bffd1;
  margin-top: 8px;
}
</style>
</head>

<body>
<div class="container">
  <h1>🌿 CannaBless Quest Hub</h1>
  <p>Community-powered • No guarantees • Built on belief</p>

  <button onclick="connectWallet()">🔐 Connect Wallet</button>
  <div id="wallet" class="wallet">Not connected</div>

  <h3>XP: <span id="xp">0</span></h3>

  <button onclick="startGame()">🎮 Start Flappy Coin</button>
  <canvas id="game" width="360" height="520"></canvas>

  <h3>🏆 Flappy Coin Leaderboard</h3>
  <div id="leaderboard"></div>
</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyDVFXgUOvsJ2sUKHAg3MRod1NlGQgEve7I",
  authDomain: "cannabless-quest-hub.firebaseapp.com",
  databaseURL: "https://cannabless-quest-hub-default-rtdb.firebaseio.com",
  projectId: "cannabless-quest-hub"
});
const db = firebase.database();

/* ================= STATE ================= */
let wallet = null;
let xp = 0;

/* ================= WALLET CONNECT ================= */
async function connectWallet() {
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  if (window.solana && window.solana.isPhantom && !isMobile) {
    const res = await window.solana.connect();
    wallet = res.publicKey.toString();
    onWalletConnected();
  } else {
    const redirect = encodeURIComponent(window.location.href);
    window.location.href =
      `https://phantom.app/ul/v1/connect?app_url=${redirect}&redirect_link=${redirect}`;
  }
}

/* Handle Phantom mobile return */
const params = new URLSearchParams(window.location.search);
if (params.has("public_key")) {
  wallet = params.get("public_key");
  window.history.replaceState({}, document.title, window.location.pathname);
  onWalletConnected();
}

function onWalletConnected() {
  document.getElementById("wallet").innerText = wallet;

  db.ref("players/" + wallet).once("value").then(snap => {
    if (snap.exists()) xp = snap.val().xp || 0;
    document.getElementById("xp").innerText = xp;
  });
}

/* ================= FLAPPY COIN ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird, pipes, velocity, gravity, playing, score;

function resetGame() {
  bird = { x: 60, y: 250, r: 12 };
  pipes = [];
  velocity = 0;
  gravity = 0.6;
  playing = true;
  score = 0;
}

function startGame() {
  resetGame();
  requestAnimationFrame(loop);
}

function flap() {
  if (playing) velocity = -8;
}

canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", flap);
document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

function loop() {
  if (!playing) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  velocity += gravity;
  bird.y += velocity;

  if (pipes.length === 0 || pipes[pipes.length - 1].x < 200) {
    const gap = 140;
    const top = Math.random() * 200 + 40;
    pipes.push({ x: canvas.width, top, gap });
  }

  pipes.forEach(p => p.x -= 2);
  pipes = pipes.filter(p => p.x > -60);

  pipes.forEach(p => {
    ctx.fillStyle = "#0f402b";
    ctx.fillRect(p.x, 0, 40, p.top);
    ctx.fillRect(p.x, p.top + p.gap, 40, canvas.height);

    if (
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + 40 &&
      (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap)
    ) endGame();
  });

  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
  ctx.fillStyle = "#6CFFB5";
  ctx.fill();

  if (bird.y > canvas.height || bird.y < 0) endGame();

  score++;
  ctx.fillStyle = "#ffffff";
  ctx.fillText("Score: " + score, 10, 20);

  requestAnimationFrame(loop);
}

function endGame() {
  playing = false;
  xp += Math.floor(score / 10);
  document.getElementById("xp").innerText = xp;

  if (wallet) {
    db.ref("players/" + wallet).set({
      xp,
      flappy: score,
      updated: Date.now()
    });
  }
  loadLeaderboard();
}

/* ================= LEADERBOARD ================= */
function loadLeaderboard() {
  db.ref("players")
    .orderByChild("flappy")
    .limitToLast(5)
    .once("value", snap => {
      let html = "";
      snap.forEach(c => {
        html = `<div>${c.key.slice(0,4)}… ${c.val().flappy || 0}</div>` + html;
      });
      document.getElementById("leaderboard").innerHTML = html;
    });
}
</script>
</body>
</html>
