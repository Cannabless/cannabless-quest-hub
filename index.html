<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CannaBless Quest Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f2d1f, #050b08);
  font-family: 'Inter', sans-serif;
  color: #eafff3;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 95%;
  max-width: 900px;
  padding: 32px;
  border-radius: 18px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(34,197,94,0.35);
  box-shadow: 0 0 60px rgba(34,197,94,0.25);
}

h1 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  color: #22c55e;
  letter-spacing: 2px;
}

p {
  text-align: center;
  opacity: 0.85;
}

button {
  width: 100%;
  max-width: 340px;
  margin: 24px auto;
  display: block;
  padding: 16px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #052e1b;
  box-shadow: 0 0 30px rgba(34,197,94,0.6);
}

.status {
  text-align: center;
  font-size: 14px;
  opacity: 0.8;
}

.dashboard {
  display: none;
  margin-top: 32px;
}

.card {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(34,197,94,0.25);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}
.card h3 {
  margin-top: 0;
  color: #22c55e;
}
</style>
</head>

<body>

<div class="container">
  <h1>CannaBless Quest Hub</h1>
  <p>Connect any Solana wallet to unlock rewards</p>

  <!-- UNIVERSAL CONNECT -->
  <button id="connectBtn">Connect Wallet</button>

  <div class="status" id="status">Wallet not connected</div>

  <div class="dashboard" id="dashboard">
    <div class="card">
      <h3>Wallet</h3>
      <p id="walletAddress"></p>
    </div>
    <div class="card">
      <h3>Holder Tier</h3>
      <p>Loading…</p>
    </div>
    <div class="card">
      <h3>Rewards</h3>
      <p>Coming online 🌱</p>
    </div>
  </div>
</div>

<!-- SOLANA WALLET STANDARD -->
<script>
const connectBtn = document.getElementById("connectBtn");
const statusText = document.getElementById("status");
const dashboard = document.getElementById("dashboard");
const walletText = document.getElementById("walletAddress");

async function connectWallet() {
  try {
    if (!window.solana && !window.solana?.connect) {
      alert("No Solana wallet detected. Please open in a wallet browser.");
      return;
    }

    const provider = window.solana;
    const response = await provider.connect();
    const pubkey = response.publicKey.toString();

    connectBtn.innerText = pubkey.slice(0, 4) + "..." + pubkey.slice(-4);
    statusText.innerText = "Wallet Connected";
    walletText.innerText = pubkey;
    dashboard.style.display = "block";

    console.log("Wallet connected:", pubkey);

  } catch (err) {
    console.error("Wallet connection failed", err);
  }
}

connectBtn.addEventListener("click", connectWallet);
</script>

</body>
</html>
